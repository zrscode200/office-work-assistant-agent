name: tests
on:
  push:
  pull_request:
jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: git config --global user.name fixture && git config --global user.email fixture@example.invalid
      - run: ./tests/run.sh
